name: Ingestão diária de boas notícias

# Roda 1x por dia — 22:00 UTC (19:00 em Brasília) — e sob demanda.
# PUBLICA automaticamente matérias APROFUNDADAS (com critério rigoroso da IA).
# Os commits levam "[skip ci]" para o Netlify NÃO reconstruir aqui: quem dispara
# o build (1x/dia) é o revisor, que já publica tudo que o coletor acumulou. Isso
# economiza o limite de builds do Netlify.
# OBS: o GitHub só executa cron a partir da branch padrão do repositório.
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publicar-noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        working-directory: portal/pipeline
        run: pip install -r requirements.txt

      - name: Gerar e publicar notícias
        working-directory: portal/pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
          MAX_DRAFTS: "3"
          PUBLICAR_AUTOMATICO: "1"
          LIMIAR_CONFIANCA: "0.72"
        run: python gerar_rascunhos.py

      - name: Commitar publicações
        run: |
          git config user.name "robo-boas-noticias"
          git config user.email "actions@github.com"
          git add portal/site/src/content/posts portal/pipeline/_estado
          if git diff --staged --quiet; then
            echo "Nada novo para publicar."
          else
            git commit -m "Publicações automáticas de boas notícias ($(date +%F)) [skip ci]"
            git push
          fi
